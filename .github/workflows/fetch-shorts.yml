name: Fetch Short Positions
on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
permissions:
  contents: read
concurrency: fetch-shorts
jobs:
  fetch:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/FetchShorts/FetchShorts.csproj
      - name: Run fetcher
        env:
          ConnectionStrings__PostgresConnection: ${{ secrets.POSTGRES_CONNECTION }}
        run: dotnet run --project src/FetchShorts/FetchShorts.csproj
